[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groupshap-gwas"
version = "0.2.0"
description = "Reproducible grouped Shapley analyses for genotype--phenotype models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<2.0",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "h5py>=3.9",
  "threadpoolctl>=3.0",
  "PyALE==1.2.0",
]

[project.optional-dependencies]
kan = ["torch>=2.0", "pykan==0.2.8"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["xai_gwas*"]
