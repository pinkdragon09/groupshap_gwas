[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "xai-gwas"
version = "0.1.0"
description = "Grouped Shapley and KAN-based explainability for GWAS and QTL mapping"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["GWAS", "QTL", "Shapley", "KAN", "explainability", "genomics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "h5py>=3.9",
]

[project.optional-dependencies]
kan = ["pykan>=0.2"]
shap = ["shap>=0.44"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
xai-gwas = "xai_gwas.cli:main"

[tool.setuptools.packages.find]
include = ["xai_gwas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
